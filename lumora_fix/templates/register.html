{% extends "base.html" %}{% block title %}LUMORA | Register{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card"><span class="kawaii-label">Begin your shelf</span><h1>Create an account.</h1><form class="editorial-form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Name</label><input name="name" required maxlength="100"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" minlength="6" required><label>Confirm Password</label><input type="password" name="confirm_password" minlength="6" required><button class="btn-editorial btn-dark">Create Account</button></form><p>Already have an account? <a href="{{url_for('login')}}">Log in</a></p></div></main>{% endblock %}
