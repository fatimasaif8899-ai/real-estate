{% extends "base.html" %}{% block title %}LUMORA | Login{% endblock %}
{% block content %}<main class="auth-page"><div class="auth-card"><span class="kawaii-label">Welcome back</span><h1>Enter the library.</h1><form class="editorial-form" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Email</label><input type="email" name="email" required autofocus><label>Password</label><input type="password" name="password" required><button class="btn-editorial btn-dark">Log In</button></form><p>New to LUMORA? <a href="{{url_for('register')}}">Create an account</a></p></div></main>{% endblock %}
